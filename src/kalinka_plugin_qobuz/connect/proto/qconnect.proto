// Qobuz Connect session messages: the subset a playback receiver sends and
// reads. Field numbers and types match the official client's wire format.
//
// Reconstructed from Pibuz (https://github.com/PhilipVinc/pibuz, commit
// 3b5abf4, crates/qconnect-protocol/src/queue_command_proto.rs), MIT License:
// Copyright (c) 2024 blitzkriegfc, Copyright (c) 2026 Filippo Vicentini.
// Regenerate the bindings with scripts/gen_proto.sh.

syntax = "proto2";

package qconnect;

enum MessageType {
  MESSAGE_TYPE_UNKNOWN = 0;
  RNDR_SRVR_JOIN_SESSION = 21;
  RNDR_SRVR_STATE_UPDATED = 23;
  RNDR_SRVR_VOLUME_CHANGED = 25;
  RNDR_SRVR_FILE_AUDIO_QUALITY_CHANGED = 26;
  RNDR_SRVR_DEVICE_AUDIO_QUALITY_CHANGED = 27;
  RNDR_SRVR_MAX_AUDIO_QUALITY_CHANGED = 28;
  RNDR_SRVR_VOLUME_MUTED = 29;
  SRVR_RNDR_SET_STATE = 41;
  SRVR_RNDR_SET_VOLUME = 42;
  SRVR_RNDR_SET_ACTIVE = 43;
  SRVR_RNDR_SET_MAX_AUDIO_QUALITY = 44;
  SRVR_RNDR_SET_LOOP_MODE = 45;
  SRVR_RNDR_SET_SHUFFLE_MODE = 46;
  SRVR_RNDR_MUTE_VOLUME = 47;
  CTRL_SRVR_JOIN_SESSION = 61;
  CTRL_SRVR_ASK_FOR_QUEUE_STATE = 76;
  CTRL_SRVR_ASK_FOR_RENDERER_STATE = 77;
  SRVR_CTRL_SESSION_STATE = 81;
  SRVR_CTRL_RENDERER_STATE_UPDATED = 82;
  SRVR_CTRL_ADD_RENDERER = 83;
  SRVR_CTRL_UPDATE_RENDERER = 84;
  SRVR_CTRL_REMOVE_RENDERER = 85;
  SRVR_CTRL_ACTIVE_RENDERER_CHANGED = 86;
  SRVR_CTRL_VOLUME_CHANGED = 87;
  SRVR_CTRL_QUEUE_ERROR_MESSAGE = 88;
  SRVR_CTRL_QUEUE_CLEARED = 89;
  SRVR_CTRL_QUEUE_STATE = 90;
  SRVR_CTRL_QUEUE_TRACKS_LOADED = 91;
  SRVR_CTRL_QUEUE_TRACKS_INSERTED = 92;
  SRVR_CTRL_QUEUE_TRACKS_ADDED = 93;
  SRVR_CTRL_QUEUE_TRACKS_REMOVED = 94;
  SRVR_CTRL_QUEUE_TRACKS_REORDERED = 95;
  SRVR_CTRL_SHUFFLE_MODE_SET = 96;
}

message QueueVersionRef {
  optional int32 major = 1;
  optional int32 minor = 2;
}

message ErrorMessage {
  optional string code = 1;
  optional string message = 2;
}

message QueueTrack {
  optional int32 queue_item_id = 1;
  optional fixed32 track_id = 2;
}

message QueueTrackWithContext {
  optional int32 queue_item_id = 1;
  optional fixed32 track_id = 2;
  optional bytes context_uuid = 3;
}

message DeviceCapabilitiesMessage {
  optional int32 min_audio_quality = 1;
  optional int32 max_audio_quality = 2;
  optional int32 volume_remote_control = 3;
}

message DeviceInfoMessage {
  optional bytes device_uuid = 1;
  optional string friendly_name = 2;
  optional string brand = 3;
  optional string model = 4;
  optional string serial_number = 5;
  optional int32 device_type = 6;
  optional DeviceCapabilitiesMessage capabilities = 7;
  optional string software_version = 8;
}

message PlaybackPositionMessage {
  optional fixed64 timestamp = 1;
  optional int32 value = 2;
}

message RendererStateMessage {
  optional int32 playing_state = 1;
  optional int32 buffer_state = 2;
  optional PlaybackPositionMessage current_position = 3;
  optional int32 duration = 4;
  optional QueueVersionRef queue_version = 5;
  optional int32 current_queue_item_id = 6;
  optional int32 next_queue_item_id = 7;
}

message JoinSessionMessage {
  optional bytes session_uuid = 1;
  optional DeviceInfoMessage device_info = 2;
  optional int32 reason = 3;
  optional RendererStateMessage initial_state = 4;
  optional bool is_active = 5;
}

message RendererStateUpdatedMessage {
  optional RendererStateMessage state = 1;
}

message RendererVolumeChangedMessage {
  optional int32 volume = 1;
}

// The stream being played; audio_quality is on the max_audio_quality scale.
message RendererFileAudioQualityChangedMessage {
  optional int32 sampling_rate = 1;
  optional int32 bit_depth = 2;
  optional int32 nb_channels = 3;
  optional int32 audio_quality = 4;
}

// What the output device runs at.
message RendererDeviceAudioQualityChangedMessage {
  optional int32 sampling_rate = 1;
  optional int32 bit_depth = 2;
  optional int32 nb_channels = 3;
}

message RendererVolumeMutedMessage {
  optional bool value = 1;
}

message RendererMaxAudioQualityChangedMessage {
  optional int32 max_audio_quality = 1;
  optional int32 network_type = 2;
}

message RendererSetStateMessage {
  optional int32 playing_state = 1;
  optional int32 current_position = 2;
  optional QueueVersionRef queue_version = 3;
  optional QueueTrackWithContext current_track = 4;
  optional QueueTrackWithContext next_track = 5;
}

message RendererSetVolumeMessage {
  optional int32 volume = 1;
  optional int32 volume_delta = 2;
}

message RendererSetActiveMessage {
  optional bool active = 1;
}

message RendererSetMaxAudioQualityMessage {
  optional int32 max_audio_quality = 1;
}

message RendererSetLoopModeMessage {
  optional int32 loop_mode = 1;
}

message RendererSetShuffleModeMessage {
  optional bool shuffle_mode = 1;
}

message RendererMuteVolumeMessage {
  optional bool value = 1;
}

message AskForQueueStateMessage {
  optional QueueVersionRef queue_version_ref = 1;
  optional bytes action_uuid = 2;
}

message AskForRendererStateMessage {
  optional int32 renderer_id = 1;
}

message CtrlSessionStateMessage {
  optional bytes session_uuid = 1;
  optional int32 active_renderer_id = 2;
  optional QueueVersionRef queue_version = 3;
  optional int32 playing_state = 4;
  optional int32 loop_mode = 5;
}

message CtrlAddRendererMessage {
  optional int32 renderer_id = 1;
  optional DeviceInfoMessage device_info = 2;
}

message CtrlUpdateRendererMessage {
  optional int32 renderer_id = 1;
  optional DeviceInfoMessage device_info = 2;
}

message CtrlRemoveRendererMessage {
  optional int32 renderer_id = 1;
}

message CtrlActiveRendererChangedMessage {
  optional int32 active_renderer_id = 1;
}

// The volume the cloud shows controllers for a renderer.
message CtrlVolumeChangedMessage {
  optional int32 renderer_id = 1;
  optional uint32 volume = 2;
}

message QueueErrorMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  optional ErrorMessage error = 3;
}

message QueueClearedMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
}

message QueueStateMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  repeated QueueTrackWithContext tracks = 3;
  optional bool shuffle_mode = 4;
  repeated int32 shuffled_track_indexes = 5;
  optional bool autoplay_mode = 6;
  optional bool autoplay_loading = 7;
  repeated QueueTrackWithContext autoplay_tracks = 8;
  optional bytes queue_hash = 100;
}

message QueueTracksLoadedMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  repeated QueueTrack tracks = 3;
  optional int32 queue_position = 4;
  optional fixed32 shuffle_seed = 5;
  optional int32 shuffle_pivot_queue_item_id = 6;
  optional bool shuffle_mode = 7;
  optional bytes context_uuid = 8;
  optional bool autoplay_reset = 9;
  optional bool autoplay_loading = 10;
  optional bytes queue_hash = 100;
}

message QueueTracksInsertedMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  repeated QueueTrack tracks = 3;
  optional int32 insert_after = 4;
  optional fixed32 shuffle_seed = 5;
  optional bytes context_uuid = 6;
  optional bool autoplay_reset = 7;
  optional bool autoplay_loading = 8;
  optional bytes queue_hash = 100;
}

message QueueTracksAddedMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  repeated QueueTrack tracks = 3;
  optional fixed32 shuffle_seed = 4;
  optional bytes context_uuid = 5;
  optional bool autoplay_reset = 6;
  optional bool autoplay_loading = 7;
  optional bytes queue_hash = 100;
}

message QueueTracksRemovedMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
  optional bool autoplay_reset = 4;
  optional bool autoplay_loading = 5;
  optional bytes queue_hash = 100;
}

message QueueTracksReorderedMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  repeated int32 queue_item_ids = 3;
  optional int32 insert_after = 4;
  optional bool autoplay_reset = 5;
  optional bool autoplay_loading = 6;
  optional bytes queue_hash = 100;
}

message ShuffleModeSetMessage {
  optional QueueVersionRef queue_version = 1;
  optional bytes action_uuid = 2;
  optional bool shuffle_mode = 3;
}

message PlaybackErrorMessage {
  optional QueueVersionRef queue_version = 1;
  optional int32 queue_item_id = 2;
  optional int32 error_type = 3;
}

// One message; the body sits at the tag equal to message_type.
message QConnectMessage {
  optional int32 message_type = 1;
  optional PlaybackErrorMessage playback_error = 3;
  optional JoinSessionMessage rndr_srvr_join_session = 21;
  optional RendererStateUpdatedMessage rndr_srvr_state_updated = 23;
  optional RendererVolumeChangedMessage rndr_srvr_volume_changed = 25;
  optional RendererFileAudioQualityChangedMessage rndr_srvr_file_audio_quality_changed = 26;
  optional RendererDeviceAudioQualityChangedMessage rndr_srvr_device_audio_quality_changed = 27;
  optional RendererMaxAudioQualityChangedMessage rndr_srvr_max_audio_quality_changed = 28;
  optional RendererVolumeMutedMessage rndr_srvr_volume_muted = 29;
  optional RendererSetStateMessage srvr_rndr_set_state = 41;
  optional RendererSetVolumeMessage srvr_rndr_set_volume = 42;
  optional RendererSetActiveMessage srvr_rndr_set_active = 43;
  optional RendererSetMaxAudioQualityMessage srvr_rndr_set_max_audio_quality = 44;
  optional RendererSetLoopModeMessage srvr_rndr_set_loop_mode = 45;
  optional RendererSetShuffleModeMessage srvr_rndr_set_shuffle_mode = 46;
  optional RendererMuteVolumeMessage srvr_rndr_mute_volume = 47;
  optional JoinSessionMessage ctrl_srvr_join_session = 61;
  optional AskForQueueStateMessage ctrl_srvr_ask_for_queue_state = 76;
  optional AskForRendererStateMessage ctrl_srvr_ask_for_renderer_state = 77;
  optional CtrlSessionStateMessage srvr_ctrl_session_state = 81;
  optional CtrlAddRendererMessage srvr_ctrl_add_renderer = 83;
  optional CtrlUpdateRendererMessage srvr_ctrl_update_renderer = 84;
  optional CtrlRemoveRendererMessage srvr_ctrl_remove_renderer = 85;
  optional CtrlActiveRendererChangedMessage srvr_ctrl_active_renderer_changed = 86;
  optional CtrlVolumeChangedMessage srvr_ctrl_volume_changed = 87;
  optional QueueErrorMessage srvr_ctrl_queue_error_message = 88;
  optional QueueClearedMessage srvr_ctrl_queue_cleared = 89;
  optional QueueStateMessage srvr_ctrl_queue_state = 90;
  optional QueueTracksLoadedMessage srvr_ctrl_queue_tracks_loaded = 91;
  optional QueueTracksInsertedMessage srvr_ctrl_queue_tracks_inserted = 92;
  optional QueueTracksAddedMessage srvr_ctrl_queue_tracks_added = 93;
  optional QueueTracksRemovedMessage srvr_ctrl_queue_tracks_removed = 94;
  optional QueueTracksReorderedMessage srvr_ctrl_queue_tracks_reordered = 95;
  optional ShuffleModeSetMessage srvr_ctrl_shuffle_mode_set = 96;
}

// The batch a CloudPayload carries.
message QConnectMessages {
  optional fixed64 messages_time = 1;
  optional int32 messages_id = 2;
  repeated QConnectMessage messages = 3;
}
