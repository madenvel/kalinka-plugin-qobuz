[build-system]
requires = ["setuptools>=68", "wheel", "build", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-qobuz"
dynamic = ["version"]
description = "Qobuz plugin for Kalinka Music Player"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    {name = "Dmitry Savin", email = "envelsavinds@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # 3.6: playing outside the play queue (Qobuz Connect), with the next track queued.
    "kalinka-plugin-sdk>=3.6,<4",
    "httpx[http2]>=0.24",
    # Qobuz Connect pairing: the local handoff endpoint and its mDNS advert.
    "h11>=0.14",
    "zeroconf>=0.47",
    "ifaddr>=0.1.7",
    # Qobuz Connect playback: the cloud session. protobuf matches the
    # committed bindings' generator (scripts/gen_proto.sh).
    "websockets>=13",
    "protobuf>=7.35,<8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
    "setuptools-scm",
    "grpcio-tools",
]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_qobuz = "kalinka_plugin_qobuz:KalinkaPluginQobuz"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/kalinka_plugin_qobuz/_version.py"
tag_regex = "^kalinka-plugin-qobuz-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-plugin-qobuz-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
# No fallback_version on purpose: a build that cannot read git metadata
# must fail, not silently produce a mislabelled wheel.
search_parent_directories = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "smoke: smoke tests for basic functionality",
    "integration: integration tests",
]